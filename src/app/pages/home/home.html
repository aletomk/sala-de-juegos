<div class="container mt-5 animate-fadeInUp">
  <div class="text-center mb-5">
    <h1>
      <i class="bi bi-controller"></i> Sala de Juegos
    </h1>
    <p class="subtitulo-home">Elegí un juego y medí tus capacidades</p>
  </div>

  <div class="row justify-content-center g-4">
    @for (juego of juegos; track juego.nombre) {
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <i class="bi {{ juego.icono }} display-4 mb-3"></i>
              <h5 class="card-title">{{ juego.nombre }}</h5>
              <p class="card-descripcion">{{ juego.descripcion }}</p>
            </div>
            <a [routerLink]="juego.ruta" class="btn btn-primary mt-3">
              Jugar
            </a>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="text-center mt-5">
    <a routerLink="/quien-soy" class="btn btn-outline-secondary">
      <i class="bi bi-person-badge"></i> Ver Quién Soy
    </a>
  </div>
</div>
