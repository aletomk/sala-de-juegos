<div class="container mt-5 animate-fadeInUp">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">

          <h2 class="card-title text-center mb-4">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
          </h2>

          @if (errorMessage()) {
            <div class="alert alert-danger">
              <i class="bi bi-exclamation-triangle"></i> {{ errorMessage() }}
            </div>
          }

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
              placeholder="tu@email.com"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
              (keydown.enter)="onLogin()"
              placeholder="••••••••"
            />
          </div>

          <button
            class="btn btn-primary w-100 mt-2"
            (click)="onLogin()"
            [disabled]="cargando()"
          >
            @if (cargando()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
              Ingresando...
            } @else {
              <i class="bi bi-box-arrow-in-right"></i> Ingresar
            }
          </button>

          <hr />

          <p class="text-center mb-2 acceso-rapido-titulo">
            <i class="bi bi-lightning"></i> Acceso rápido
          </p>

          <div class="d-flex flex-column gap-2">
            @for (usuario of usuariosRapidos; track usuario.email) {
              <button
                class="btn btn-acceso-rapido"
                (click)="loginRapido(usuario)"
                [disabled]="cargando()"
              >
                <i class="bi bi-person-fill"></i> {{ usuario.nombre }}
              </button>
            }
          </div>

          <hr />

          <p class="texto-redireccion">
            ¿No tenés cuenta?
            <a routerLink="/registro">Registrate</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</div>
